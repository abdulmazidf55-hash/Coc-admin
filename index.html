<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Cloud of Core Control Panel</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0f1e, #1a2639);
            color: white;
            padding: 30px;
            min-height: 100vh;
        }
        
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px 30px;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 20px;
            border: 2px solid cyan;
            box-shadow: 0 0 40px rgba(0,255,255,0.3);
        }
        
        h1 {
            color: cyan;
            text-shadow: 0 0 20px cyan;
            font-size: 2.2rem;
        }
        
        .live-badge {
            background: #00ff00;
            color: #0a0f1e;
            padding: 5px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-left: 15px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .logout-btn {
            background: transparent;
            border: 2px solid cyan;
            color: cyan;
            padding: 10px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .logout-btn:hover {
            background: cyan;
            color: #0a0f1e;
            box-shadow: 0 0 30px cyan;
        }
        
        .section {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 2px solid cyan;
        }
        
        .section h2 {
            color: cyan;
            margin-bottom: 25px;
            font-size: 1.8rem;
            border-bottom: 2px solid cyan;
            padding-bottom: 10px;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        
        .grid-5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: cyan;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #00ffff33;
            border-radius: 8px;
            color: white;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: cyan;
            box-shadow: 0 0 20px cyan;
        }
        
        .save-btn {
            background: cyan;
            color: #0a0f1e;
            border: none;
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 20px;
        }
        .save-btn:hover {
            box-shadow: 0 0 50px cyan;
            transform: scale(1.02);
        }
        
        .preview-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px dashed cyan;
        }
        
        .student-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 5px solid cyan;
        }
        
        .rank-item-admin {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="admin-container" id="admin-panel" style="display: none;">
        <div class="header">
            <h1>
                <i class="fas fa-crown" style="color: cyan;"></i> 
                ADMIN CONTROL PANEL 
                <span class="live-badge">🔴 REAL-TIME</span>
            </h1>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> LOGOUT</button>
        </div>

        <!-- Total Students Count -->
        <div class="section">
            <h2><i class="fas fa-users"></i> Total Students Counter</h2>
            <input type="text" id="total-students-input" placeholder="e.g., 2026 Total Students: 1852">
            <button class="save-btn" onclick="updateTotalStudents()">Update Total Students</button>
        </div>

        <!-- Batch Statistics Control -->
        <div class="section">
            <h2><i class="fas fa-chart-line"></i> Batch Statistics (Trade Style)</h2>
            <div class="grid-5" id="batch-stats-admin">
                <!-- Dynamically populated -->
            </div>
            <button class="save-btn" onclick="saveBatchStats()">Update Batch Stats</button>
        </div>

        <!-- Top 10 Ranking Control -->
        <div class="section">
            <h2><i class="fas fa-trophy"></i> Top 10 Students Ranking</h2>
            <div id="ranking-admin" class="grid-2"></div>
            <button class="save-btn" onclick="saveRanking()">Update Ranking</button>
        </div>

        <!-- Notice Control -->
        <div class="section">
            <h2><i class="fas fa-fire"></i> Live Notice (Fire Animation)</h2>
            <textarea id="notice-input" rows="4" placeholder="Enter notice..."></textarea>
            <button class="save-btn" onclick="saveNotice()">Update Notice</button>
        </div>

        <!-- 305 Batch Students Control -->
        <div class="section">
            <h2><i class="fas fa-user-graduate"></i> 305 Batch Students</h2>
            <div id="students-container"></div>
            <button class="save-btn" onclick="saveAllStudents()">Update 305 Batch Students</button>
        </div>
    </div>

    <!-- Login -->
    <div id="admin-login" style="max-width: 400px; margin: 100px auto; background: rgba(30,41,59,0.9); padding: 40px; border-radius: 20px; border: 2px solid cyan;">
        <h2 style="color: cyan; text-align: center; margin-bottom: 30px;">🔐 ADMIN LOGIN</h2>
        <input type="email" id="admin-email" placeholder="📧 Email" style="width:100%; padding:12px; margin:10px 0; background:#0f172a; border:1px solid cyan; color:white; border-radius:8px;">
        <input type="password" id="admin-password" placeholder="🔑 Password" style="width:100%; padding:12px; margin:10px 0; background:#0f172a; border:1px solid cyan; color:white; border-radius:8px;">
        <button onclick="adminLogin()" style="width:100%; padding:12px; background:cyan; color:#0a0f1e; border:none; border-radius:30px; font-weight:bold; cursor:pointer;">
            Login to Control Panel
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDZjU69H4bIEHvQ5OeEAbVNt8ay8XF4178",
            authDomain: "cloudofcore-e7554.firebaseapp.com",
            projectId: "cloudofcore-e7554",
            storageBucket: "cloudofcore-e7554.firebasestorage.app",
            messagingSenderId: "965527739763",
            appId: "1:965527739763:web:c451eb823bc4daa6007906",
            measurementId: "G-BGETFS0LSL"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const studentNames = ['majedul islam fahad', 'sayid hossain sayem', 'abu talha shamim', 'kamrul hassan sojib'];

        function adminLogin() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    document.getElementById('admin-login').style.display = 'none';
                    document.getElementById('admin-panel').style.display = 'block';
                    loadAdminData();
                })
                .catch(err => alert('Login failed: ' + err.message));
        }

        function logout() {
            auth.signOut().then(() => {
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('admin-login').style.display = 'block';
            });
        }

        function loadAdminData() {
            // Load total students
            db.collection('settings').doc('general').get().then(doc => {
                if (doc.exists) {
                    document.getElementById('total-students-input').value = doc.data().totalStudents;
                }
            });

            // Load batch stats
            loadBatchStatsAdmin();
            
            // Load ranking
            loadRankingAdmin();
            
            // Load notice
            db.collection('notices').doc('latest').get().then(doc => {
                if (doc.exists) {
                    document.getElementById('notice-input').value = doc.data().content;
                }
            });

            // Load 305 students
            loadStudentsAdmin();
        }

        function loadBatchStatsAdmin() {
            const container = document.getElementById('batch-stats-admin');
            const batches = ['301', '302', '303', '304', '305'];
            let html = '';
            
            batches.forEach(batch => {
                html += `
                    <div style="background: #1e293b; padding: 15px; border-radius: 10px;">
                        <h3 style="color: cyan; margin-bottom: 10px;">Batch ${batch}</h3>
                        <input type="text" id="batch-${batch}-value" placeholder="Value" style="margin-bottom: 5px;">
                        <select id="batch-${batch}-trend">
                            <option value="up">📈 Up</option>
                            <option value="down">📉 Down</option>
                        </select>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            db.collection('batchStats').get().then(snapshot => {
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const input = document.getElementById(`batch-${data.batch}-value`);
                    const select = document.getElementById(`batch-${data.batch}-trend`);
                    if (input) input.value = data.value;
                    if (select) select.value = data.trend;
                });
            });
        }

        function loadRankingAdmin() {
            const container = document.getElementById('ranking-admin');
            let html = '';
            
            for (let i = 1; i <= 10; i++) {
                html += `
                    <div class="rank-item-admin">
                        <h4 style="color: cyan;">#${i}</h4>
                        <input type="text" id="rank-${i}-name" placeholder="Student Name" style="margin-bottom: 5px;">
                        <input type="number" id="rank-${i}-points" placeholder="Points">
                    </div>
                `;
            }
            
            container.innerHTML = html;
            
            db.collection('ranking').orderBy('points', 'desc').limit(10).get().then(snapshot => {
                let i = 1;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    document.getElementById(`rank-${i}-name`).value = data.name;
                    document.getElementById(`rank-${i}-points`).value = data.points;
                    i++;
                });
            });
        }

        function loadStudentsAdmin() {
            const container = document.getElementById('students-container');
            container.innerHTML = '';
            
            studentNames.forEach(name => {
                const div = document.createElement('div');
                div.className = 'student-card';
                div.innerHTML = `
                    <h3 style="color: cyan;">${name.toUpperCase()}</h3>
                    <div class="grid-3">
                        <div>
                            <label>Class Points:</label>
                            <input type="number" id="${name}-classPoints">
                        </div>
                        <div>
                            <label>Total Points:</label>
                            <input type="number" id="${name}-totalPoints">
                        </div>
                        <div>
                            <label>Exam Marks:</label>
                            <input type="number" id="${name}-examMarks">
                        </div>
                        <div>
                            <label>Total Marks:</label>
                            <input type="number" id="${name}-totalMarks">
                        </div>
                    </div>
                    <div style="margin-top: 15px;">
                        <label>Notice:</label>
                        <textarea id="${name}-notice" rows="2"></textarea>
                    </div>
                `;
                container.appendChild(div);

                db.collection('students').doc(name).get().then(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById(`${name}-classPoints`).value = data.classPoints || 0;
                        document.getElementById(`${name}-totalPoints`).value = data.totalPoints || 0;
                        document.getElementById(`${name}-examMarks`).value = data.examMarks || 0;
                        document.getElementById(`${name}-totalMarks`).value = data.totalMarks || 0;
                        document.getElementById(`${name}-notice`).value = data.notice || '';
                    }
                });
            });
        }

        function updateTotalStudents() {
            const val = document.getElementById('total-students-input').value;
            db.collection('settings').doc('general').set({ totalStudents: val })
                .then(() => alert('Total students updated!'));
        }

        function saveBatchStats() {
            const batches = ['301', '302', '303', '304', '305'];
            const batch = db.batch();
            
            batches.forEach(b => {
                const value = document.getElementById(`batch-${b}-value`).value;
                const trend = document.getElementById(`batch-${b}-trend`).value;
                if (value) {
                    const ref = db.collection('batchStats').doc(b);
                    batch.set(ref, { batch: b, value, trend });
                }
            });
            
            batch.commit().then(() => alert('Batch stats updated!'));
        }

        function saveRanking() {
            const batch = db.batch();
            
            for (let i = 1; i <= 10; i++) {
                const name = document.getElementById(`rank-${i}-name`).value;
                const points = parseInt(document.getElementById(`rank-${i}-points`).value) || 0;
                
                if (name) {
                    const ref = db.collection('ranking').doc(`rank-${i}`);
                    batch.set(ref, { name, points });
                }
            }
            
            batch.commit().then(() => alert('Ranking updated!'));
        }

        function saveNotice() {
            const content = document.getElementById('notice-input').value;
            db.collection('notices').doc('latest').set({ content })
                .then(() => alert('Notice updated!'));
        }

        function saveAllStudents() {
            const batch = db.batch();
            
            studentNames.forEach(name => {
                const data = {
                    classPoints: parseInt(document.getElementById(`${name}-classPoints`).value) || 0,
                    totalPoints: parseInt(document.getElementById(`${name}-totalPoints`).value) || 0,
                    examMarks: parseInt(document.getElementById(`${name}-examMarks`).value) || 0,
                    totalMarks: parseInt(document.getElementById(`${name}-totalMarks`).value) || 0,
                    notice: document.getElementById(`${name}-notice`).value || ''
                };
                const ref = db.collection('students').doc(name);
                batch.set(ref, data);
            });
            
            batch.commit().then(() => alert('All students updated!'));
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadAdminData();
            } else {
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('admin-login').style.display = 'block';
            }
        });
    </script>
</body>
</html>
